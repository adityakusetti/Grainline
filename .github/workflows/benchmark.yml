name: Grainline benchmark

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "How many times to run the benchmark (AI answers vary a little)"
        required: true
        default: "3"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
        run: python -m eval.benchmark --runs ${{ inputs.runs }} --markdown-out benchmark.md
      - name: Show results on the run page
        if: always()
        run: cat benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.md
