name: Grainline PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Grainline review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          GRAINLINE_FAIL_ON_BLOCK: ${{ vars.GRAINLINE_FAIL_ON_BLOCK }}
        run: python -m grainline.cli pr
      - name: Save audit record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grainline-records-pr-${{ github.event.pull_request.number }}
          path: reports/
