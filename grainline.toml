[grainline]
model = "openai/gpt-oss-120b"
max_ai_findings = 5          # noise budget per PR
review_extensions = [".py", ".sql", ".go"]
models_dir = "examples/models"     # SQL models checked by the data proof
fixtures_dir = "examples/fixtures" # CSVs loaded as tables
tests_dir = "tests"
coverage_threshold = 70.0
ready_score = 80
reports_dir = "reports"
