name: Grainline requirements

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Analyze issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
        run: python -m grainline.cli issue
      - name: Save audit record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grainline-records-issue-${{ github.event.issue.number }}
          path: reports/
